<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>shayak</title>
  <style>
    /* width */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }


    /* Track */
    ::-webkit-scrollbar-track {
      box-shadow: inset 0 0 0px grey;
      border-radius: 10px;
    }


    /* Handle */
    ::-webkit-scrollbar-thumb {
      background: #30b3a867;
      border-radius: 10px;
    }


    /* Handle on hover */
    ::-webkit-scrollbar-thumb:hover {
      background: #ff0404;
    }
  </style>

</head>


<body style="margin: 0;">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
